services:
  postgres:
    image: postgres:14-alpine
    ports:
      - 5432:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_PASSWORD=mhakhean_code_local
      - POSTGRES_USER=mhakhean_code_local
      - POSTGRES_DB=mhakhean_code_local
    networks:
      - shared_network

networks:
  shared_network:
    external: true